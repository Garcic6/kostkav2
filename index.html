<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Kostka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f8fafc; /* Jemně šedé minimalistické pozadí */
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .scene {
            width: 200px;
            height: 200px;
            perspective: 800px; /* Hloubka 3D prostoru pro realistický efekt */
            margin-bottom: 3rem;
            position: relative;
        }

        /* Stín pod kostkou */
        .shadow {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%) rotateX(90deg);
            width: 140px;
            height: 140px;
            background: radial-gradient(rgba(0, 0, 0, 0.4), transparent 70%);
            border-radius: 50%;
            filter: blur(10px);
            transition: all 0.5s ease;
        }

        .dice {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d; /* Udržuje 3D prostor pro potomky (strany) */
            /* Plynulá a realistická animace rotace (zpomaluje se nakonec) */
            transition: transform 2.5s cubic-bezier(0.15, 0.95, 0.35, 1); 
            transform: rotateX(25deg) rotateY(25deg); /* Výchozí natočení */
        }

        .face {
            position: absolute;
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #ffffff, #f0f0f0); /* Mírný plastický vzhled */
            border-radius: 20px; /* Zaoblené hrany typické pro kostky */
            top: 40px;
            left: 40px;
            box-shadow: 
                inset 0 0 15px rgba(0, 0, 0, 0.1), /* Vnitřní stínování hran */
                0 0 5px rgba(0, 0, 0, 0.2); /* Vnější jemný stín */
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 15px;
            gap: 5px;
            backface-visibility: hidden; /* Pro optimalizaci a čistší renderování */
        }

        .dot {
            background-color: #222;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            justify-self: center;
            align-self: center;
            box-shadow: inset 0 3px 5px rgba(0, 0, 0, 0.6), 0 1px 1px rgba(255, 255, 255, 0.8); /* Vyrytý efekt */
        }

        /* Červená tečka pro jedničku (prémiový vzhled) */
        .face-1 .dot {
            background-color: #ef4444;
            width: 30px;
            height: 30px;
            box-shadow: inset 0 4px 6px rgba(100, 0, 0, 0.8), 0 1px 1px rgba(255, 255, 255, 0.8);
        }

        .face-1 .dot { grid-area: 2 / 2; }
        
        .face-2 .dot:nth-child(1) { grid-area: 1 / 3; }
        .face-2 .dot:nth-child(2) { grid-area: 3 / 1; }
        
        .face-3 .dot:nth-child(1) { grid-area: 1 / 3; }
        .face-3 .dot:nth-child(2) { grid-area: 2 / 2; }
        .face-3 .dot:nth-child(3) { grid-area: 3 / 1; }
        
        .face-4 .dot:nth-child(1) { grid-area: 1 / 1; }
        .face-4 .dot:nth-child(2) { grid-area: 1 / 3; }
        .face-4 .dot:nth-child(3) { grid-area: 3 / 1; }
        .face-4 .dot:nth-child(4) { grid-area: 3 / 3; }
        
        .face-5 .dot:nth-child(1) { grid-area: 1 / 1; }
        .face-5 .dot:nth-child(2) { grid-area: 1 / 3; }
        .face-5 .dot:nth-child(3) { grid-area: 2 / 2; }
        .face-5 .dot:nth-child(4) { grid-area: 3 / 1; }
        .face-5 .dot:nth-child(5) { grid-area: 3 / 3; }
        
        .face-6 .dot:nth-child(1) { grid-area: 1 / 1; }
        .face-6 .dot:nth-child(2) { grid-area: 2 / 1; }
        .face-6 .dot:nth-child(3) { grid-area: 3 / 1; }
        .face-6 .dot:nth-child(4) { grid-area: 1 / 3; }
        .face-6 .dot:nth-child(5) { grid-area: 2 / 3; }
        .face-6 .dot:nth-child(6) { grid-area: 3 / 3; }

        .face-1 { transform: rotateY(0deg) translateZ(60px); }
        .face-6 { transform: rotateY(180deg) translateZ(60px); }
        .face-3 { transform: rotateY(90deg) translateZ(60px); }
        .face-4 { transform: rotateY(-90deg) translateZ(60px); }
        .face-2 { transform: rotateX(90deg) translateZ(60px); }
        .face-5 { transform: rotateX(-90deg) translateZ(60px); }

        /* Animace skoku nahoru během házení */
        @keyframes jump {
            0% { transform: translateY(0); }
            50% { transform: translateY(-50px); }
            100% { transform: translateY(0); }
        }
        .jumping {
            animation: jump 0.8s ease-out;
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="shadow" id="diceShadow"></div>
        <div class="dice" id="dice">
            <!-- Strana 1 -->
            <div class="face face-1"><div class="dot"></div></div>
            <!-- Strana 2 -->
            <div class="face face-2">
                <div class="dot"></div><div class="dot"></div>
            </div>
            <!-- Strana 3 -->
            <div class="face face-3">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
            <!-- Strana 4 -->
            <div class="face face-4">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
            <!-- Strana 5 -->
            <div class="face face-5">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
            <!-- Strana 6 -->
            <div class="face face-6">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
        </div>
    </div>

    <button onclick="rollDice()" class="px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-full shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 active:translate-y-0 active:shadow-md text-lg tracking-wide">
        Hodit kostkou
    </button>
    
    <div id="resultText" class="mt-6 text-2xl font-bold text-gray-700 opacity-0 transition-opacity duration-500 h-8">
        Padla hodnota!
    </div>

    <script>
        const dice = document.getElementById('dice');
        const scene = document.querySelector('.scene');
        const resultText = document.getElementById('resultText');
        
        // Uchováváme celkovou rotaci, abychom mohli plynule přidávat další otáčky bez "přetáčení" zpět
        let currentX = 25; 
        let currentY = 25;
        let isRolling = false;

        function rollDice() {
            if (isRolling) return;
            isRolling = true;
            resultText.style.opacity = '0'; // Skrýt výsledek před novým hodem

            // Vizuální skok (krychle vyskočí mírně nahoru do prostoru)
            scene.classList.remove('jumping');
            void scene.offsetWidth; // Trigger reflow pro restart animace
            scene.classList.add('jumping');

            // Vygenerování náhodného čísla (1-6)
            const result = Math.floor(Math.random() * 6) + 1;

            // Základní natočení (X a Y), aby zvolená strana mířila přímo na uživatele
            let targetX, targetY;
            
            switch(result) {
                case 1: targetX = 0; targetY = 0; break;      // Přední
                case 6: targetX = 0; targetY = 180; break;    // Zadní
                case 3: targetX = 0; targetY = -90; break;    // Pravá (potřeba otočit kostku vlevo -> Y-90)
                case 4: targetX = 0; targetY = 90; break;     // Levá (potřeba otočit kostku vpravo -> Y+90)
                case 2: targetX = -90; targetY = 0; break;    // Horní (potřeba otočit kostku dolů -> X-90)
                case 5: targetX = 90; targetY = 0; break;     // Spodní (potřeba otočit kostku nahoru -> X+90)
            }

            // Přidáme náhodný počet celých otoček (360 stupňů) v obou osách pro dramatický efekt točení
            // Přičítáme k aktuální rotaci, abychom zaručili, že se kostka vždy točí dopředu
            let spinsX = (Math.floor(Math.random() * 4) + 3) * 360; // 3 až 6 otáček v ose X
            let spinsY = (Math.floor(Math.random() * 4) + 3) * 360; // 3 až 6 otáček v ose Y

            // Zarovnáme aktuální hodnotu na nejbližší násobek 360 a přidáme cílovou hodnotu
            let finalX = currentX + spinsX + targetX - (currentX % 360);
            let finalY = currentY + spinsY + targetY - (currentY % 360);

            // Pokud bychom narazili na nějakou anomálii s modulem při záporných číslech, přepočítáme natvrdo
            // ale takto to většinou udržuje kostku v rotaci.
            
            // Aplikace CSS transformace
            dice.style.transform = `rotateX(${finalX}deg) rotateY(${finalY}deg)`;
            
            // Uložení aktuální rotace pro další hod
            currentX = finalX;
            currentY = finalY;

            // Počkat, až doběhne animace rotace (nastaveno na 2.5s v CSS)
            setTimeout(() => {
                resultText.innerText = `Padla ${result}!`;
                resultText.style.opacity = '1';
                isRolling = false;
            }, 2500);
        }
    </script>
</body>
</html>
